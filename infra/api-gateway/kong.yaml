# ==============================================================================
# Kong API Gateway: Declarative Configuration
# ==============================================================================
# Purpose:
#   Defines the routing logic, service mappings, and global/service-level plugins
#   for the Kong API Gateway (DB-less mode).
#
# Role in the System:
#   - Acts as the single entry point for all external traffic.
#   - Maps public endpoints (e.g., /joke-api) to internal microservice addresses.
#   - Enforces security policies like HTTPS redirection and rate limiting.
# ==============================================================================

_format_version: "3.0"

services:
  # 1. Joke API Service
  - name: joke-service
    url: http://10.0.1.11:4000
    routes:
      - name: joke-route
        paths:
          - /joke-api
        strip_path: true
        protocols: ["https"]
        https_redirect_status_code: 301
    plugins:
      - name: rate-limiting
        config:
          minute: 8  # Limits users to 8 requests per minute to prevent abuse
          policy: local
          hide_client_headers: false 

  # 2. Submit Microservice
  - name: submit-service
    url: http://10.1.1.11:4200
    routes:
      - name: submit-route
        paths:
          - /submit-api
        strip_path: true
        protocols: ["https"]
        https_redirect_status_code: 301

  # 3. Moderate Microservice
  - name: moderate-service
    url: http://10.1.1.12:4300
    routes:
      - name: moderate-route
        paths:
          - /moderate-api
        strip_path: true
        protocols: ["https"]
        https_redirect_status_code: 301