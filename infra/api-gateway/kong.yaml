_format_version: "3.0"
services:
  # 1. Joke API Service
  - name: joke-service
    url: http://joke_api:3001
    routes:
      - name: joke-route
        paths:
          - /joke-api
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 8  # Keep demo-friendly low limit for now; increase if needed
          policy: local
          hide_client_headers: false  # ensure Kong forwards X-RateLimit-* and Retry-After headers to clients

  # 2. Submit Microservice
  - name: submit-service
    url: http://submit_app:3002
    routes:
      - name: submit-route
        paths:
          - /submit-api
        strip_path: true

  # 3. Moderate Microservice
  - name: moderate-service
    url: http://moderate_app:3003
    routes:
      - name: moderate-route
        paths:
          - /moderate-api
        strip_path: true