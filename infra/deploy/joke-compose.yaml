# ==============================================================================
# Docker Compose: Core Joke Services (API, ETL, and Databases)
# ==============================================================================
# Purpose:
#   Orchestrates the deployment of the Joke API, the Joke ETL (Extract, 
#   Transform, Load) service, and the underlying databases (MySQL and MongoDB).
#
# Role in the System:
#   - joke-api: Serves jokes to clients and handles GET/POST requests.
#   - joke-etl: Processes moderated jokes from RabbitMQ and stores them.
#   - mysql: Relational storage for structured joke data.
#   - mongo: Document-based storage for flexible joke schema (alternative DB).
#   - Uses Docker Profiles to dynamically select the active database.
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jokes_db
    ports: ["4002:3306"]
    networks:
      - joke-network
    profiles: ["mysql"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports: ["4002:27017"]
    networks:
      - joke-network
    profiles: ["mongo"]
    volumes:
      - mongo_data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js

  joke-api:
    image: ghcr.io/lehan2512/joke-api:latest
    restart: unless-stopped
    ports: ["4000:3000"]
    environment:
      - PORT=3000
      - DB_TYPE=${DB_TYPE:-MYSQL}
      - DB_HOST=mysql
      - MONGO_URI=mongodb://mongo:27017
    volumes:
      - joke_api_data:/usr/src/app/data
    networks:
      - joke-network

  joke-etl:
    image: ghcr.io/lehan2512/joke-etl:latest
    restart: unless-stopped
    ports: ["4001:3001"]
    environment:
      - PORT=3001
      - DB_TYPE=${DB_TYPE:-MYSQL}
      - DB_HOST=mysql
      - MONGO_URI=mongodb://mongo:27017
      - RABBITMQ_URL=amqp://10.1.1.10
    networks:
      - joke-network

networks:
  joke-network:
    driver: bridge

volumes:
  joke_api_data:
  mysql_data:
  mongo_data: