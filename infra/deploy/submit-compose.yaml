# ==============================================================================
# Docker Compose: Submit Microservice
# ==============================================================================
# Purpose:
#   Deploys the Submit application, allowing users to propose new jokes 
#   for moderation and eventual inclusion in the system.
#
# Role in the System:
#   - Provides a public-facing API for joke submissions.
#   - Forwards valid submissions to the RabbitMQ broker for the moderation queue.
# ==============================================================================

services:
  submit-app:
    image: ghcr.io/lehan2512/submit-app:latest
    restart: unless-stopped
    ports: ["4200:3200"]    
    environment:
      - PORT=3200
      - RABBITMQ_URL=amqp://10.1.1.10
    volumes:
      - submit_cache:/usr/src/app/cache
    networks:
      - joke-network
volumes:
  submit_cache:
networks:
  joke-network:
    driver: bridge
