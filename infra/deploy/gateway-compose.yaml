# ==============================================================================
# Docker Compose: Kong API Gateway
# ==============================================================================
# Purpose:
#   Deploys the Kong API Gateway in DB-less mode, using the declarative 
#   configuration specified in kong.yaml.
#
# Role in the System:
#   - Acts as the main entry point (reverse proxy) for all incoming API requests.
#   - Handles TLS/SSL termination using Let's Encrypt certificates.
#   - Routes traffic based on path-based rules to the internal microservices.
# ==============================================================================

services:
  kong:
    image: kong:latest
    container_name: kong_gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:80, 0.0.0.0:443 ssl
      KONG_SSL_CERT: /certs/live/gateway/fullchain.pem
      KONG_SSL_CERT_KEY: /certs/live/gateway/privkey.pem
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./kong.yaml:/kong/declarative/kong.yaml
      - /etc/letsencrypt:/certs:ro
    networks:
      - joke-network
networks:
  joke-network:
    driver: bridge
