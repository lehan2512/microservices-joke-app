<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #4B1A70;
            --primary-hover: #612B9F;
            --accent-purple: #8A40C6;
            --background: #F4F5F7;
            --surface: #FFFFFF;
            --text-main: #172B4D;
            --text-muted: #6B778C;
            --success: #00875A;
            --border: #DFE1E6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 42px rgba(9, 30, 66, 0.12), 0 0 1px rgba(9, 30, 66, 0.31);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-purple);
            margin: 0 0 8px 0;
            letter-spacing: -0.8px;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            text-align: left;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            background-color: #FAFBFC;
            cursor: pointer;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B778C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-purple);
            background-color: var(--surface);
            box-shadow: 0 0 0 3px rgba(75, 26, 112, 0.1);
        }

        #fetchBtn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background-color: var(--primary-purple);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        #fetchBtn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        #fetchBtn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .joke-stage {
            margin-top: 20px;
            padding: 40px 24px;
            background-color: #FAFBFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #setup {
            font-size: 24px; /* Maintaining the bigger font size */
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 24px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #punchline {
            font-size: 32px; /* Maintaining the large headline size */
            font-weight: 800;
            line-height: 1.2;
            color: var(--success);
            opacity: 0;
            transform: scale(0.9) translateY(10px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fade-in { opacity: 1 !important; }
        
        .pop-in {
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Want to hear a joke?</h1>
        </div>
        
        <div class="controls-row">
            <div class="form-group">
                <label for="typeSelect">Category</label>
                <select id="typeSelect">
                    <option value="any">Any Category</option>
                </select>
            </div>
            
            <button id="fetchBtn" onclick="fetchJoke()">
                <span id="btnText">Fetch Joke</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </div>

        <div class="joke-stage">
            <div id="setup"></div>
            <div id="punchline"></div>
        </div>
    </div>

    <script>
        async function loadTypes() {
            try {
                const response = await fetch('/joke-api/types');
                const types = await response.json();
                const select = document.getElementById('typeSelect');
                
                select.innerHTML = '<option value="any">Any Category</option>';
                types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type.charAt(0).toUpperCase() + type.slice(1);
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Failed to load types via Gateway", error);
            }
        }

        document.getElementById('typeSelect').addEventListener('focus', loadTypes);

        async function fetchJoke() {
            const type = document.getElementById('typeSelect').value;
            const setupDiv = document.getElementById('setup');
            const punchlineDiv = document.getElementById('punchline');
            const btn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            // 1. Reset UI States immediately
            setupDiv.classList.remove('fade-in');
            punchlineDiv.classList.remove('pop-in');
            
            // 2. Clear previous joke text so it doesn't "peek" through
            setupDiv.innerText = "";
            punchlineDiv.innerText = "";
            
            // Loading UI
            btn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';

            setTimeout(async () => {
                try {
                    const response = await fetch(`/joke-api/joke/${type}?count=1`);
                    
                    if (response.status === 429) {
                        setupDiv.innerText = "Rate limit exceeded. Try again later.";
                        setupDiv.style.color = "#dc3545";
                        setupDiv.classList.add('fade-in');
                        // Ensure punchline remains empty on error
                        punchlineDiv.innerText = ""; 
                    } else {
                        const jokes = await response.json();
                        setupDiv.style.color = "var(--text-main)";
                        
                        if (jokes.length > 0) {
                            const joke = jokes[0];
                            
                            // Show Setup
                            setupDiv.innerText = joke.setup;
                            setupDiv.classList.add('fade-in');
                            
                            // Set Punchline text but it stays invisible because .pop-in is gone
                            punchlineDiv.innerText = joke.punchline;

                            // Reveal Punchline after delay
                            setTimeout(() => {
                                // Double check that we still have a punchline to show 
                                // (prevents punchline appearing if user clicked again quickly)
                                if (punchlineDiv.innerText !== "") {
                                    punchlineDiv.classList.add('pop-in');
                                }
                            }, 3000);
                            
                        } else {
                            setupDiv.innerText = "No jokes found here. Try another category?";
                            setupDiv.classList.add('fade-in');
                        }
                    }
                } catch (error) {
                    setupDiv.innerText = "Connection error. Is the API running?";
                    setupDiv.classList.add('fade-in');
                } finally {
                    btn.disabled = false;
                    btnText.style.display = 'inline';
                    btnSpinner.style.display = 'none';
                }
            }, 300);
        }

        loadTypes();
    </script>
</body>
</html>
