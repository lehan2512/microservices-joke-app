<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #4B1A70;
            --primary-hover: #612B9F;
            --background: #F4F5F7;
            --surface: #FFFFFF;
            --text-main: #172B4D;
            --text-muted: #6B778C;
            --success: #00875A;
            --error: #DE350B;
            --border: #DFE1E6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            padding: 0;
        }

        /* --- UNIFIED SIDEBAR CSS --- */
        .layout { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, var(--primary-purple), var(--primary-hover));
            color: white;
            padding: 28px 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .nav-brand {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.4px;
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s ease;
        }
        .nav-links a.active, .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
        }
        /* -------------------------- */

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 42px rgba(9, 30, 66, 0.12), 0 0 1px rgba(9, 30, 66, 0.31);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .header { margin-bottom: 32px; }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-purple);
            margin: 0 0 8px 0;
            letter-spacing: -0.8px;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            text-align: left;
            align-items: flex-end;
        }
        .form-group { flex: 1; }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            background-color: #FAFBFC;
            cursor: pointer;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B778C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        #fetchBtn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background-color: var(--primary-purple);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        #fetchBtn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        #fetchBtn:disabled { background-color: var(--text-muted); cursor: not-allowed; transform: none; }

        .joke-stage {
            margin-top: 20px;
            padding: 40px 24px;
            background-color: #FAFBFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .joke-card {
            padding: 18px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 6px 18px rgba(9,30,66,0.06);
        }
        .joke-setup {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-main);
            margin-bottom: 24px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .joke-punchline {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            color: var(--success);
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fade-in { opacity: 1 !important; }
        .pop-in { opacity: 1 !important; transform: scale(1) translateY(0) !important; }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="layout">
        <nav class="sidebar" aria-label="Main navigation">
            <div class="nav-brand">Joke App</div>
            <div class="nav-links">
                <a href="/joke-api" id="nav-joke">Jokes</a>
                <a href="/submit-api" id="nav-submit">Submit</a>
                <a href="/moderate-api" id="nav-moderate">Moderate</a>
            </div>
        </nav>

        <main class="main">
            <div class="container">
                <div class="header">
                    <h1>Want to hear a joke?</h1>
                </div>
                
                <div class="controls-row">
                    <div class="form-group">
                        <label for="typeSelect">Joke Type</label>
                        <select id="typeSelect">
                            <option value="any">Any Category</option>
                        </select>
                    </div>
                    
                    <button id="fetchBtn" onclick="fetchJoke()">
                        <span id="btnText">Fetch Joke</span>
                        <div class="spinner" id="btnSpinner"></div>
                    </button>
                </div>

                <div class="joke-stage">
                    <div id="jokeContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const baseUrl = '/joke-api';

        (function setupNavigation(){
            const path = window.location.pathname;
            const map = [
                { id: 'nav-joke', match: '/joke-api' },
                { id: 'nav-submit', match: '/submit-api' },
                { id: 'nav-moderate', match: '/moderate-api' }
            ];

            map.forEach(m => { 
                const el = document.getElementById(m.id); 
                if (!el) return; 
                el.href = m.match; 
                if (path.startsWith(m.match)) {
                    el.classList.add('active'); 
                }
            });
        })();

        function renderJoke(joke) {
            const container = document.getElementById('jokeContainer');
            container.innerHTML = '';
            if (!joke) return;

            const card = document.createElement('div');
            card.className = 'joke-card';
            
            const su = document.createElement('div'); 
            su.className = 'joke-setup'; 
            su.innerText = joke.setup;
            
            const pu = document.createElement('div'); 
            pu.className = 'joke-punchline'; 
            pu.innerText = joke.punchline;
            
            card.appendChild(su); 
            card.appendChild(pu);
            container.appendChild(card);

            setTimeout(() => { su.classList.add('fade-in'); }, 80);
            setTimeout(() => { pu.classList.add('pop-in'); }, 2000);
        }

        async function loadTypes() {
            try {
                const response = await fetch(`${baseUrl}/types`);
                const types = await response.json();
                const select = document.getElementById('typeSelect');
                
                select.innerHTML = '<option value="any">Any Category</option>';
                types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type.charAt(0).toUpperCase() + type.slice(1);
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Failed to load types", error);
            }
        }

        let rateLimitExpires = 0;

        function disableUntil(seconds) {
            const btn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            rateLimitExpires = Date.now() + (seconds * 1000);
            btn.disabled = true;
            btnText.style.display = 'inline';

            let remaining = seconds;
            const origText = "Fetch Joke";
            
            btnText.textContent = `Retry in ${remaining}s`;

            const timer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(timer);
                    rateLimitExpires = 0;
                    btn.disabled = false;
                    btnText.textContent = origText;
                } else {
                    btnText.textContent = `Retry in ${remaining}s`;
                }
            }, 1000);
        }

        async function fetchJoke() {
            const type = document.getElementById('typeSelect').value;
            const container = document.getElementById('jokeContainer');
            const btn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            container.innerHTML = '';
            btn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';

            try {
                const response = await fetch(`${baseUrl}/joke/${type}?count=1`);

                if (response.status === 429) {
                    let retryAfter = parseInt(response.headers.get('retry-after')) || 60;
                    container.innerHTML = `
                        <div class="joke-card">
                            <div class="joke-setup" style="color:#DE350B; opacity:1; font-size: 20px;">
                               Rate limit exceeded.
                            </div>
                        </div>`;
                    disableUntil(retryAfter);
                } else {
                    const jokes = await response.json();
                    if (Array.isArray(jokes) && jokes.length > 0) {
                        renderJoke(jokes[0]);
                    } else {
                        container.innerHTML = `<div class="joke-card"><div class="joke-setup fade-in">No jokes found.</div></div>`;
                    }
                }
            } catch (error) {
                container.innerHTML = `<div class="joke-card"><div class="joke-setup fade-in">Connection error.</div></div>`;
            } finally {
                if (Date.now() >= rateLimitExpires) {
                    btnSpinner.style.display = 'none';
                    btnText.style.display = 'inline';
                    btn.disabled = false;
                }
            }
        }

        document.getElementById('typeSelect').addEventListener('focus', loadTypes);
        loadTypes();
    </script>
</body>
</html>
