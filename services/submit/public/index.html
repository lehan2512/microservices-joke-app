<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Joke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #4B1A70;
            --primary-hover: #612B9F;
            --background: #F4F5F7;
            --surface: #FFFFFF;
            --text-main: #172B4D;
            --text-muted: #6B778C;
            --success: #00875A;
            --error: #DE350B;
            --border: #DFE1E6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            padding: 0;
        }

        .layout { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, var(--primary-purple), var(--primary-hover));
            color: white;
            padding: 28px 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .nav-brand {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.4px;
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s ease;
        }
        .nav-links a.active, .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
        }

        .main { flex:1; display:flex; justify-content:center; align-items:center; padding:20px }

        .container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 42px rgba(9, 30, 66, 0.12), 0 0 1px rgba(9, 30, 66, 0.31);
            width: 100%;
            max-width: 500px;
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-purple);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            background-color: #FAFBFC;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-purple);
            background-color: var(--surface);
            box-shadow: 0 0 0 3px rgba(75, 26, 112, 0.1);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B778C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background-color: var(--primary-purple);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active { transform: translateY(0); }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 24px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
            transition: opacity 0.5s ease;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="layout">
        <nav class="sidebar" aria-label="Main navigation">
            <div class="nav-brand">Joke App</div>
            <div class="nav-links">
                <a href="/joke-api" id="nav-joke">Jokes</a>
                <a href="/submit-api" id="nav-submit">Submit</a>
                <a href="/moderate-api" id="nav-moderate">Moderate</a>
            </div>
        </nav>

        <main class="main">
            <div class="container">
                <div class="header">
                    <h2>Submit a New Joke</h2>
                </div>
                
                <div class="form-group">
                    <label for="setup">Joke Setup</label>
                    <input type="text" id="setup" placeholder="e.g: Why did the software engineer cross the road?" required>
                </div>

                <div class="form-group">
                    <label for="punchline">Punchline</label>
                    <input type="text" id="punchline" placeholder="e.g: To get to the other git branch." required>
                </div>

                <div class="form-group">
                    <label for="typeSelect">Joke Type</label>
                    <select id="typeSelect" onchange="handleTypeChange()">
                        <option value="" disabled>Select a category...</option>
                    </select>
                </div>

                <div class="form-group hidden" id="newTypeGroup">
                    <label for="newType">New Joke Type</label>
                    <input type="text" id="newType" placeholder="e.g., programming">
                </div>

                <button id="submitBtn" onclick="submitJoke()">Submit Joke</button>

                <div id="message"></div>
            </div>
        </main>
    </div>

    <script>
        const baseUrl = '/submit-api';

        (function setupNavigation(){
            const path = window.location.pathname;
            const map = [
                { id: 'nav-joke', match: '/joke-api' },
                { id: 'nav-submit', match: '/submit-api' },
                { id: 'nav-moderate', match: '/moderate-api' }
            ];

            map.forEach(m => { 
                const el = document.getElementById(m.id); 
                if (!el) return; 
                el.href = m.match; 
                if (path.startsWith(m.match)) {
                    el.classList.add('active'); 
                }
            });
        })();

        async function loadTypes() {
            try {
                const select = document.getElementById('typeSelect');
                const currentValue = select.value; 

                const response = await fetch(`${baseUrl}/types`);
                const types = await response.json();
                
                select.innerHTML = '<option value="" disabled>Select a category...</option>';
                
                types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type.charAt(0).toUpperCase() + type.slice(1);
                    select.appendChild(option);
                });
                
                const tempOption = document.createElement('option');
                tempOption.value = "detected_new";
                tempOption.textContent = "+ New Joke Type";
                tempOption.style.fontWeight = "bold";
                select.appendChild(tempOption);

                if (currentValue) {
                    select.value = currentValue;
                } else {
                    select.value = ""; 
                }

            } catch (error) {
                console.error("Error loading types:", error);
            }
        }

        function handleTypeChange() {
            const select = document.getElementById('typeSelect');
            const customInput = document.getElementById('newType');
            const customGroup = document.getElementById('newTypeGroup');

            if (select.value === "detected_new") {
                customGroup.classList.remove('hidden');
                customInput.disabled = false;
                customInput.focus();
            } else {
                customGroup.classList.add('hidden');
                customInput.disabled = true;
                customInput.value = '';
            }
        }

        async function submitJoke() {
            const setupField = document.getElementById('setup');
            const punchlineField = document.getElementById('punchline');
            const typeField = document.getElementById('typeSelect');
            const newTypeField = document.getElementById('newType');
            const btn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message'); 
            const selectedType = typeField.value;
            const finalType = selectedType === 'detected_new' ? newTypeField.value.trim() : selectedType;

            if (!setupField.value.trim() || !punchlineField.value.trim() || !finalType) {
                messageDiv.style.color = 'var(--error)';
                messageDiv.innerText = "Please fill in all fields.";
                messageDiv.style.opacity = "1";
                return;
            }

            btn.disabled = true;
            messageDiv.style.opacity = "1";
            messageDiv.style.color = 'var(--text-muted)';
            messageDiv.innerText = "Submitting...";

            try {
                const response = await fetch(`${baseUrl}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        setup: setupField.value.trim(), 
                        punchline: punchlineField.value.trim(), 
                        type: finalType 
                    })
                });

                if (response.ok) {
                    messageDiv.style.color = 'var(--success)';
                    messageDiv.innerText = "Success! Joke submitted for moderation.";
                    
                    setupField.value = '';
                    punchlineField.value = '';
                    newTypeField.value = '';
                    typeField.value = '';
                    handleTypeChange();

                    setTimeout(() => {
                        messageDiv.style.opacity = "0";
                        setTimeout(() => { messageDiv.innerText = ""; }, 500);
                    }, 5000);

                } else {
                    throw new Error("Submission failed");
                }
            } catch (error) {
                messageDiv.style.color = 'var(--error)';
                messageDiv.innerText = "Submission error. Please try again.";
                
                setTimeout(() => {
                    messageDiv.style.opacity = "0";
                    setTimeout(() => { messageDiv.innerText = ""; }, 500);
                }, 5000);
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('typeSelect').addEventListener('focus', loadTypes);
        loadTypes();
    </script>
</body>
</html>
