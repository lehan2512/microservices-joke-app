# ==============================================================================
# GitHub Actions Workflow: Build, Push, and Deploy Docker Images
# ==============================================================================
# Purpose:
#   Automates the CI/CD pipeline for the joke-delivery microservices.
#   Builds Docker images, pushes them to GitHub Container Registry (GHCR),
#   and deploys the latest services to their respective VMs.
#
# Role in the System:
#   - Orchestrates the deployment of Joke-API, Joke-ETL, Submit-App, and Moderate-App.
#   - Manages database profiles (MySQL/MongoDB) for the Joke services.
#   - Ensures high availability and automated updates for the application layer.
# ==============================================================================

name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ========================================================================
  # BUILD AND PUSH: Builds and tags Docker images for each microservice.
  # ========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: joke-api
            context: ./services/joke-api
          - image_name: joke-etl
            context: ./services/joke-etl
          - image_name: submit-app
            context: ./services/submit
          - image_name: moderate-app
            context: ./services/moderate
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}:latest
          labels: ${{ steps.meta.outputs.labels }}

  # ========================================================================
  # DEPLOY: Pulls images and restarts services on the targeted VMs.
  # ========================================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================================
      # JOKE VM DEPLOYMENT: Core API and Data Processing Logic
      # ========================================================================
      - name: Copy All Files to Joke VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.JOKE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/deploy/joke-compose.yaml,infra/db-init/init.sql,infra/db-init/init.js"
          target: "/home/azureuser/"
          strip_components: 2
          timeout: 60s

      - name: Deploy to Joke VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.JOKE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mv -f /home/azureuser/joke-compose.yaml /home/azureuser/docker-compose.yaml
            
            # 1. Capture the GitHub Variable (fallback to MYSQL if not set)
            TARGET_DB="${{ vars.DB_TYPE }}"
            if [ -z "$TARGET_DB" ]; then TARGET_DB="MYSQL"; fi
            
            # 2. Write it into a .env file so it survives container reboots
            echo "DB_TYPE=$TARGET_DB" > /home/azureuser/.env
            
            # 3. Pull latest images
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            
            # 4. Convert TARGET_DB to lowercase (mysql or mongo) to match the profile name
            PROFILE_NAME=$(echo "$TARGET_DB" | tr '[:upper:]' '[:lower:]')
            
            # 5. Stop and remove the non-target database container since both DB use same Port
            if [ "$PROFILE_NAME" = "mongo" ]; then
              sudo docker compose stop mysql 2>/dev/null || true
              sudo docker compose rm -f mysql 2>/dev/null || true
            else
              sudo docker compose stop mongo 2>/dev/null || true
              sudo docker compose rm -f mongo 2>/dev/null || true
            fi

            # 6. Spin up only the requested database profile and the APIs
            sudo docker compose --profile $PROFILE_NAME up -d
      
      # ========================================================================
      # SUBMIT VM DEPLOYMENT: User Submission Endpoint
      # ========================================================================
      - name: Copy Compose File to Submit VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SUBMIT_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/deploy/submit-compose.yaml"
          target: "/home/azureuser/"
          strip_components: 2

      - name: Deploy to Submit VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SUBMIT_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mv -f /home/azureuser/submit-compose.yaml /home/azureuser/docker-compose.yaml
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d

      # ========================================================================
      # MODERATE VM DEPLOYMENT: Admin Moderation Dashboard and Logic
      # ========================================================================
      - name: Copy Compose File to Moderate VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MODERATE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/deploy/moderate-compose.yaml"
          target: "/home/azureuser/"
          strip_components: 2

      - name: Deploy to Moderate VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MODERATE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mv -f /home/azureuser/moderate-compose.yaml /home/azureuser/docker-compose.yaml
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
