name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # FIXED: Updated context paths to match your repository structure
          - image_name: joke-api
            context: ./services/joke-api
          - image_name: joke-etl
            context: ./services/joke-etl
          - image_name: submit-app
            context: ./services/submit
          - image_name: moderate-app
            context: ./services/moderate
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JOKE VM DEPLOYMENT
      # ==========================================
      - name: Copy Compose File to Joke VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.JOKE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/deploy/joke-compose.yaml"
          target: "/home/azureuser/"
          strip_components: 2 # Strips infra/deploy/ so the file lands directly in the home folder

      - name: Copy SQL Init Script to Joke VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.JOKE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/db-init/init.sql"
          target: "/home/azureuser/infra/db-init/"
          strip_components: 2
          
      - name: Deploy to Joke VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.JOKE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mv /home/azureuser/joke-compose.yaml /home/azureuser/docker-compose.yaml
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            # Target Grade Option: Dynamically inject DB variable and profile
            sudo DB_TYPE=MONGO docker compose --profile mongo up -d
      
      # ==========================================
      # SUBMIT VM DEPLOYMENT
      # ==========================================
      - name: Copy Compose File to Submit VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SUBMIT_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/deploy/submit-compose.yaml"
          target: "/home/azureuser/"
          strip_components: 2

      - name: Deploy to Submit VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SUBMIT_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mv /home/azureuser/submit-compose.yaml /home/azureuser/docker-compose.yaml
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d

      # ==========================================
      # MODERATE VM DEPLOYMENT
      # ==========================================
      - name: Copy Compose File to Moderate VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MODERATE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          source: "infra/deploy/moderate-compose.yaml"
          target: "/home/azureuser/"
          strip_components: 2

      - name: Deploy to Moderate VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MODERATE_VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: ${{ secrets.GATEWAY_IP }}
          proxy_username: azureuser
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mv /home/azureuser/moderate-compose.yaml /home/azureuser/docker-compose.yaml
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d